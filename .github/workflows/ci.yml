name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: virel
          POSTGRES_PASSWORD: virel
          POSTGRES_DB: virel_drive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://virel:virel@localhost:5432/virel_drive_test
      AUTH_SECRET: ci-test-secret-not-for-production
      PRISMA_OFFLINE: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
